<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>마케팅팀 오피스</title>
<meta name="theme-color" content="#1d1b2b">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="마케팅 오피스">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🏢</text></svg>">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/galmuri@latest/dist/galmuri.css">
<style>
:root {
  --bg: #1d1b2b;
  --panel: #2a2740;
  --panel-2: #353150;
  --ink: #f4f1ff;
  --muted: #a9a3c9;
  --line: #48436b;
  --accent: #ff7a59;
  --gold: #ffcf5a;
  --good: #4fd1a5;
  --daily: #ff8a5b;
  --weekly: #5b8cff;
  --monthly: #2bb37e;
  --quarterly: #9b6bff;
  --paper: #fffaf0;
  --paper-ink: #24212f;
  --paper-muted: #6f6a80;
  --paper-line: #e8e1d1;
}
* { box-sizing: border-box; }
html, body { margin: 0; }
body {
  background: var(--bg);
  color: var(--ink);
  font-family: "Pretendard Variable", Pretendard, -apple-system, "Apple SD Gothic Neo", sans-serif;
  line-height: 1.6;
  word-break: keep-all;
  min-height: 100vh;
}
.pixel { font-family: "Galmuri11", "Pretendard Variable", monospace; }
button { font: inherit; cursor: pointer; }
.app { max-width: 1120px; margin: 0 auto; padding: 16px 16px 48px; }

/* HUD */
.hud { display: flex; flex-wrap: wrap; align-items: center; gap: 12px; margin-bottom: 12px; }
.hud h1 { font-size: 18px; margin: 0; letter-spacing: -0.01em; }
.hud .clock { color: var(--muted); font-size: 14px; }
.hud .spacer { flex: 1; }
.me { display: flex; align-items: center; gap: 10px; background: var(--panel); border: 2px solid var(--line); border-radius: 10px; padding: 6px 12px; }
.me .lv { font-weight: 800; color: var(--gold); font-size: 13px; }
.me .title { font-weight: 700; font-size: 14px; }
.xpbar { width: 110px; height: 8px; background: var(--bg); border-radius: 4px; overflow: hidden; }
.xpbar i { display: block; height: 100%; background: linear-gradient(90deg, var(--gold), var(--accent)); width: 0; transition: width .6s; }
.xptext { font-size: 11px; color: var(--muted); }
.streak { font-weight: 700; font-size: 14px; }
button.me { color: var(--ink); font: inherit; text-align: left; }
button.me:hover { border-color: var(--accent); }
.lvlist { list-style: none; margin: 12px 0 0; padding: 0; display: grid; gap: 6px; }
.lvlist li { display: flex; gap: 12px; align-items: center; background: #fff; border: 2px solid var(--paper-line); border-radius: 10px; padding: 8px 12px; }
.lvlist li.cur { border-color: var(--gold); box-shadow: 0 0 0 2px #ffe9a8; }
.lvlist li.locked { opacity: .6; }
.lvlist .n { font-weight: 800; width: 44px; flex: none; font-size: 13px; color: var(--paper-muted); }
.lvlist .t { flex: 1; min-width: 0; }
.lvlist .t b { font-size: 14.5px; }
.lvlist .t span { display: block; font-size: 13px; color: var(--paper-muted); }
.lvlist .s { flex: none; font-size: 12.5px; font-weight: 700; text-align: right; }
.wlist { list-style: none; margin: 12px 0 0; padding: 0; display: grid; gap: 8px; }
.wlist li { background: #fff; border: 2px solid var(--paper-line); border-radius: 10px; padding: 10px 14px; }
.wlist .src { font-size: 12px; color: var(--paper-muted); font-weight: 600; }
.wlist .q { font-weight: 700; margin: 2px 0 4px; white-space: pre-line; }
.wlist details { font-size: 13.5px; }
.wlist summary { cursor: pointer; color: var(--paper-muted); font-weight: 700; font-size: 12.5px; }
.bgrid { display: grid; grid-template-columns: repeat(auto-fill, minmax(min(100%, 190px), 1fr)); gap: 8px; margin-top: 12px; }
.bgrid div { background: #fff; border: 2px solid var(--paper-line); border-radius: 10px; padding: 10px 12px; }
.bgrid div.got { border-color: var(--gold); }
.bgrid div.no { opacity: .55; }
.bgrid .i { font-size: 24px; line-height: 1; }
.bgrid b { display: block; margin-top: 4px; font-size: 14px; }
.bgrid span { display: block; font-size: 12.5px; color: var(--paper-muted); }
.inotes { list-style: none; margin: 6px 0 0; padding: 0 0 0 10px; border-left: 2px solid #b8e6cd; font-size: 13px; }
.inotes li { margin: 0 0 6px; white-space: pre-line; }
.inotes time { display: block; font-size: 11px; font-weight: 700; color: #1e8a5f; }
.grow { margin-top: 6px; background: #e9f9f1; color: #1e8a5f; border: 2px solid #b8e6cd; border-radius: 8px; padding: 3px 10px; font-size: 12.5px; font-weight: 700; }
.ititle { font-size: 18px; margin: 8px 0 4px; }
.ibox { background: #fff; border: 2px solid var(--paper-line); border-radius: 10px; padding: 10px 12px; margin-top: 10px; font-size: 14px; white-space: pre-line; }
.ibox b { display: block; font-size: 11.5px; color: var(--paper-muted); margin-bottom: 2px; }
.iprompt { background: #fff8e1; border-radius: 8px; padding: 8px 10px; font-size: 13px; margin: 10px 0 0; }
.field textarea { display: block; width: 100%; margin-top: 4px; border: 2px solid var(--paper-line); border-radius: 8px; padding: 8px 10px; font: inherit; font-weight: 400; resize: vertical; }
.tnames { display: grid; grid-template-columns: repeat(auto-fill, minmax(min(100%, 180px), 1fr)); gap: 0 12px; }
.tnames .field { margin: 6px 0; }
.howto { background: #fff; border: 2px dashed var(--paper-line); border-radius: 10px; padding: 10px 14px 10px 30px; margin: 12px 0 0; font-size: 13.5px; }
.hud-btn { background: var(--panel); color: var(--ink); border: 2px solid var(--line); border-radius: 10px; padding: 6px 12px; font-size: 14px; font-weight: 600; }
.hud-btn:hover { border-color: var(--accent); }

/* Layout */
.main { display: grid; grid-template-columns: minmax(0, 1fr) 300px; gap: 16px; align-items: start; }
@media (max-width: 880px) { .main { grid-template-columns: 1fr; } }
.stage { position: relative; background: #000; border: 3px solid var(--line); border-radius: 12px; overflow: hidden; }
canvas#office { display: block; width: 100%; height: auto; image-rendering: pixelated; image-rendering: crisp-edges; }
.bubble { position: absolute; transform: translateY(-100%); background: #fff; color: #24212f; border: 2px solid #24212f; border-radius: 8px; padding: 2px 8px; font-size: 12px; font-weight: 700; white-space: nowrap; max-width: 46%; overflow: hidden; text-overflow: ellipsis; pointer-events: none; box-shadow: 0 2px 0 rgba(0,0,0,.25); }
.bubble::after { content: ""; position: absolute; left: var(--tail, 50%); bottom: -6px; margin-left: -4px; border: 4px solid transparent; border-top-color: #24212f; }
.bubble.alert { background: #ffcf5a; animation: hop 1s infinite; }
@keyframes hop { 50% { transform: translateY(calc(-100% - 3px)); } }
@media (max-width: 600px) { .bubble { font-size: 10.5px; padding: 1px 6px; } }
.stage-tip { position: absolute; right: 10px; bottom: 8px; font-size: 11px; color: #fff; background: rgba(0,0,0,.45); padding: 2px 8px; border-radius: 6px; pointer-events: none; }

.side { display: flex; flex-direction: column; gap: 12px; }
.panel { background: var(--panel); border: 2px solid var(--line); border-radius: 12px; padding: 12px; }
.panel h2 { font-size: 13px; color: var(--muted); margin: 0 0 8px; font-weight: 700; }
.member { display: flex; gap: 10px; align-items: center; width: 100%; text-align: left; background: var(--panel-2); color: var(--ink); border: 2px solid transparent; border-radius: 10px; padding: 8px; margin-bottom: 6px; }
.member:hover { border-color: var(--line); }
.member.alert { border-color: var(--gold); animation: pulse 1.4s infinite; }
@keyframes pulse { 50% { box-shadow: 0 0 0 3px rgba(255, 207, 90, .25); } }
.member img { width: 36px; height: 48px; image-rendering: pixelated; flex: none; }
.member .who { font-weight: 700; font-size: 14px; }
.member .role { font-size: 11px; color: var(--muted); }
.member .st { font-size: 12px; margin-top: 2px; }
.dot { display: inline-block; width: 8px; height: 8px; border-radius: 50%; margin-right: 4px; vertical-align: 1px; }
.log { list-style: none; margin: 0; padding: 0; font-size: 12.5px; max-height: 220px; overflow: auto; }
.log li { display: flex; gap: 8px; padding: 3px 0; border-bottom: 1px dashed var(--line); }
.log time { color: var(--muted); flex: none; font-variant-numeric: tabular-nums; }
.empty { color: var(--muted); font-size: 13px; }

/* Modal */
.modal-bg { position: fixed; inset: 0; background: rgba(10, 8, 20, .7); display: none; align-items: center; justify-content: center; padding: 24px 12px; z-index: 10; }
.modal-bg.open { display: flex; }
.modal { background: var(--paper); color: var(--paper-ink); border-radius: 14px; width: min(860px, 100%); max-height: calc(100vh - 48px); max-height: calc(100dvh - 48px); overflow: auto; box-shadow: 0 8px 0 rgba(0,0,0,.35); border: 3px solid #1b1726; }
.modal.small { width: min(460px, 100%); }
.modal-head { display: flex; gap: 12px; align-items: center; padding: 16px 20px; border-bottom: 2px solid var(--paper-line); position: sticky; top: 0; background: var(--paper); border-radius: 14px 14px 0 0; z-index: 1; }
.modal-head img { width: 48px; height: 64px; image-rendering: pixelated; }
.modal-head .say { flex: 1; }
.modal-head .from { font-size: 12px; color: var(--paper-muted); font-weight: 600; }
.modal-head .line { font-weight: 700; font-size: 15px; }
.x { background: none; border: none; font-size: 26px; line-height: 1; color: var(--paper-muted); padding: 4px 8px; }
.modal-body { padding: 16px 20px 24px; }
.badge { display: inline-block; font-size: 11px; font-weight: 800; color: #fff; padding: 2px 8px; border-radius: 999px; }
.r-period { color: var(--paper-muted); font-size: 13px; font-weight: 600; margin: 6px 0 0; }
.r-headline { font-size: clamp(20px, 3.2vw, 28px); line-height: 1.35; margin: 4px 0 14px; letter-spacing: -0.02em; }
.r-summary { background: #fff; border: 2px solid var(--paper-line); border-radius: 10px; padding: 12px 16px 12px 34px; margin: 0 0 10px; }
.r-summary li { margin: 4px 0; }
.chips { display: flex; flex-wrap: wrap; gap: 6px; margin: 10px 0; }
.chips span { background: #ffe9e1; color: #d4512f; font-weight: 700; font-size: 12.5px; padding: 2px 10px; border-radius: 999px; }
.r-sec { margin-top: 26px; }
.r-sec > h3 { font-size: 18px; margin: 0 0 10px; }
.r-cards { display: grid; grid-template-columns: repeat(auto-fill, minmax(min(100%, 340px), 1fr)); gap: 10px; }
.r-card { background: #fff; border: 2px solid var(--paper-line); border-radius: 12px; padding: 14px; display: flex; flex-direction: column; }
.r-card.scrapped { border-color: var(--gold); }
.r-meta { display: flex; gap: 6px; align-items: center; font-size: 12px; }
.r-meta .rank { background: var(--paper-ink); color: #fff; width: 22px; height: 22px; border-radius: 50%; display: inline-flex; align-items: center; justify-content: center; font-weight: 800; }
.r-meta .tag { color: #d4512f; font-weight: 800; }
.r-meta .brand { color: var(--paper-muted); font-weight: 600; }
.r-meta .scrap { margin-left: auto; background: none; border: 2px solid var(--paper-line); border-radius: 8px; padding: 1px 8px; font-size: 12px; font-weight: 700; color: var(--paper-muted); }
.r-card.scrapped .scrap { background: var(--gold); border-color: var(--gold); color: var(--paper-ink); }
.r-card h4 { font-size: 16px; line-height: 1.4; margin: 8px 0 4px; }
.r-card p { margin: 0; font-size: 14px; }
.r-card ul.pts { margin: 6px 0 0; padding-left: 18px; font-size: 14px; }
.note { border-radius: 8px; padding: 8px 10px; margin-top: 8px; font-size: 13.5px; }
.note b { display: block; font-size: 11.5px; }
.note.why { background: #eef2ff; } .note.why b { color: #3b5bdb; }
.note.act { background: #e9f9f1; } .note.act b { color: #1e8a5f; }
.srcs { list-style: none; padding: 8px 0 0; margin: auto 0 0; border-top: 1px dashed var(--paper-line); font-size: 12px; }
.r-card .srcs { margin-top: 10px; }
.srcs li { overflow-wrap: anywhere; }
.srcs a { color: var(--paper-muted); }
.memo { margin-top: 8px; display: none; }
.r-card.scrapped .memo { display: block; }
.memo label { display: block; font-size: 11.5px; font-weight: 700; color: var(--paper-muted); margin-top: 6px; }
.memo label textarea { display: block; margin-top: 3px; font-weight: 400; color: var(--paper-ink); }
.memo textarea { width: 100%; min-height: 52px; border: 2px solid var(--paper-line); border-radius: 8px; padding: 6px 8px; font: inherit; font-size: 13px; resize: vertical; background: #fffdf6; }
.r-foot { display: flex; flex-wrap: wrap; gap: 10px; align-items: center; margin-top: 28px; padding-top: 16px; border-top: 2px solid var(--paper-line); }
.btn { border: 3px solid #1b1726; background: var(--accent); color: #fff; font-weight: 800; border-radius: 10px; padding: 10px 18px; box-shadow: 0 3px 0 #1b1726; }
.btn:active { transform: translateY(2px); box-shadow: 0 1px 0 #1b1726; }
.btn.ghost { background: #fff; color: var(--paper-ink); }
.btn[disabled] { background: #cfd8d3; color: #4c5a53; cursor: default; }
.link { color: var(--paper-muted); font-size: 13px; }

/* quiz */
.qprog { font-size: 12px; color: var(--paper-muted); font-weight: 700; }
.qtext { font-size: 18px; font-weight: 800; line-height: 1.45; margin: 6px 0 14px; white-space: pre-line; }
.qopt { display: block; width: 100%; text-align: left; background: #fff; border: 2px solid var(--paper-line); border-radius: 10px; padding: 10px 14px; margin-bottom: 8px; font-size: 15px; color: var(--paper-ink); }
.qopt:hover:not([disabled]) { border-color: var(--paper-ink); }
.qopt[disabled] { cursor: default; }
.qopt.right { background: #e3f8ee; border-color: #1e8a5f; font-weight: 700; }
.qopt.wrong { background: #ffe8e3; border-color: #d4512f; }
.qexp { background: #fff; border: 2px dashed var(--paper-line); border-radius: 10px; padding: 10px 14px; margin: 6px 0 14px; font-size: 14px; }
.qscore { font-size: 40px; font-weight: 900; margin: 4px 0; }

/* archive & scrapbook */
.tabs { display: flex; flex-wrap: wrap; gap: 6px; margin-bottom: 12px; }
.tabs button { border: 2px solid var(--paper-line); background: #fff; border-radius: 999px; padding: 4px 12px; font-size: 13px; font-weight: 700; color: var(--paper-muted); }
.tabs button.on { background: var(--paper-ink); color: #fff; border-color: var(--paper-ink); }
.arch { list-style: none; padding: 0; margin: 0; }
.arch li button { display: flex; width: 100%; gap: 10px; align-items: center; text-align: left; background: #fff; border: 2px solid var(--paper-line); border-radius: 10px; padding: 10px 12px; margin-bottom: 6px; color: var(--paper-ink); }
.arch li button:hover { border-color: var(--paper-ink); }
.arch .ck { width: 22px; flex: none; text-align: center; }
.arch .t { display: block; font-size: 12px; color: var(--paper-muted); font-weight: 600; }
.arch .h { display: block; font-weight: 700; font-size: 14.5px; }
.search { width: 100%; border: 2px solid var(--paper-line); border-radius: 10px; padding: 8px 12px; font: inherit; margin-bottom: 10px; }
.toolbar { display: flex; gap: 8px; flex-wrap: wrap; margin-bottom: 12px; }
.field { display: block; margin: 10px 0; font-size: 14px; font-weight: 600; }
.field input { display: block; width: 100%; margin-top: 4px; border: 2px solid var(--paper-line); border-radius: 8px; padding: 8px 10px; font: inherit; }
.center { text-align: center; }
.levelup img { width: 72px; height: 96px; image-rendering: pixelated; }
.levelup h3 { font-size: 22px; margin: 8px 0 4px; }
.toast { visibility: hidden; position: fixed; left: 50%; bottom: 24px; transform: translateX(-50%) translateY(120px); background: #1b1726; color: #fff; border: 2px solid var(--gold); padding: 8px 16px; border-radius: 10px; font-weight: 700; transition: transform .3s; z-index: 20; }
.toast.show { visibility: visible; transform: translateX(-50%) translateY(0); }
</style>
</head>
<body>
<div class="app">
  <header class="hud">
    <h1 class="pixel">🏢 마케팅팀 오피스</h1>
    <span class="clock pixel" id="clock"></span>
    <span class="spacer"></span>
    <button class="me" id="btn-level" title="직급표 보기">
      <span class="lv pixel" id="lv">Lv.1</span>
      <span class="title" id="rank">인턴</span>
      <span><span class="xpbar"><i id="xpfill"></i></span><span class="xptext" id="xptext"></span></span>
    </button>
    <span class="streak" id="streak" title="리포트를 읽은 연속 일수"></span>
    <button class="hud-btn" id="btn-archive">📥 받은 리포트</button>
    <button class="hud-btn" id="btn-scrap">📌 스크랩북</button>
    <button class="hud-btn" id="btn-wrong">📝 오답노트</button>
    <button class="hud-btn" id="btn-badges">🏅 업적</button>
    <button class="hud-btn" id="btn-settings" aria-label="설정">⚙️</button>
  </header>

  <div class="main">
    <div class="stage">
      <canvas id="office" width="320" height="224"></canvas>
      <div id="bubbles"></div>
      <span class="stage-tip" id="tip">팀원이나 책상을 클릭해보세요</span>
    </div>
    <aside class="side">
      <section class="panel">
        <h2>팀원</h2>
        <div id="roster"></div>
      </section>
      <section class="panel">
        <h2>오늘의 오피스 로그</h2>
        <ul class="log" id="log"></ul>
      </section>
    </aside>
  </div>
</div>

<div class="modal-bg" id="modal-bg"><div class="modal" id="modal"></div></div>
<div class="toast" id="toast"></div>

<script src="assets/reports-data.js"></script>
<script src="assets/run-status.js"></script>
<script>
"use strict";
/* ───────────────────────── 설정 ───────────────────────── */
const KINDS = ["daily", "weekly", "monthly", "quarterly"];
const KIND_NAME = { daily: "데일리", weekly: "위클리", monthly: "먼슬리", quarterly: "분기" };
const KIND_COLOR = { daily: "#ff8a5b", weekly: "#5b8cff", monthly: "#2bb37e", quarterly: "#9b6bff" };
const XP_READ = { daily: 10, weekly: 25, monthly: 40, quarterly: 60 };
const OFF_HOUR = 18;

const TEAM = {
  daily: {
    name: "하루", title: "사원", job: "데일리 트렌드 담당", time: [9, 0], when: "매일 09:00",
    look: { hair: "#c2566b", long: true, shirt: "#ff8a5b", shirtDark: "#e06a3d", accent: "#ffd166", pants: "#3d405b" },

    idle: ["오늘 성수에 팝업 또 생겼대요!", "이 밈 아직 모르시면 큰일나요 ㅎㅎ", "숏폼 포맷은 일주일이면 바뀌어요.", "어제 본 광고 레퍼런스 저장해두셨어요?"],
  },
  weekly: {
    name: "주디", title: "대리", job: "위클리 이슈 담당", time: [9, 10], when: "매주 월 09:10",
    look: { hair: "#2b2b2b", long: false, shirt: "#5b8cff", shirtDark: "#3d6be0", accent: "#ffffff", pants: "#2d3142" },
    deliver: "{me}님, 지난주 제일 뜨거웠던 것만 추렸어요.",
    writing: "지난주 데일리 다시 훑어보는 중이에요.",
    thanks: "다음 주 월요일에 또 정리해올게요.",
    idle: ["월요일 아침엔 위클리죠.", "한 주만 지나도 순위가 확 바뀌어요.", "이번 주는 어떤 게 터질까요?"],
  },
  monthly: {
    name: "달래", title: "과장", job: "먼슬리 결산 담당", time: [9, 20], when: "매월 1일 09:20",
    look: { hair: "#6b4226", long: true, shirt: "#2bb37e", shirtDark: "#1f8f63", accent: "#f4f1de", pants: "#33415c" },
    deliver: "이번 달 결산 보고 드립니다, {me}님.",

// ?time=09:00 (와 ?date=2026-10-10)을 붙이면 그 시각부터 흘러가는 것처럼 미리 볼 수 있다
const QS = new URLSearchParams(location.search);
const SIM_T = (QS.get("time") || "").match(/^(\d{1,2}):(\d{2})$/);
const SIM_D = (QS.get("date") || "").match(/^(\d{4})-(\d{2})-(\d{2})$/);
const SIM = SIM_T || SIM_D;
const OFFSET = SIM ? (() => {
  const t = new Date();
  if (SIM_D) t.setFullYear(+SIM_D[1], +SIM_D[2] - 1, +SIM_D[3]);
  if (SIM_T) t.setHours(+SIM_T[1], +SIM_T[2], 0, 0);
  return t - Date.now();
})() : 0;
const NOW = () => new Date(Date.now() + OFFSET);
const pad = n => String(n).padStart(2, "0");
const ymd = d => `${d.getFullYear()}-${pad(d.getMonth() + 1)}-${pad(d.getDate())}`;
const hm = d => `${pad(d.getHours())}:${pad(d.getMinutes())}`;
function isoWeek(d) {
  const t = new Date(Date.UTC(d.getFullYear(), d.getMonth(), d.getDate()));
  const day = t.getUTCDay() || 7;
  t.setUTCDate(t.getUTCDate() + 4 - day);
  const y = t.getUTCFullYear();
  const w = Math.ceil(((t - Date.UTC(y, 0, 1)) / 864e5 + 1) / 7);
  return `${y}-W${pad(w)}`;
}
/** scripts/run.py의 period()와 같은 규칙으로 오늘 나와야 할 리포트 id */
function expectedId(kind, now) {
  const d = new Date(now.getFullYear(), now.getMonth(), now.getDate());
  if (kind === "daily") return ymd(d);
  if (kind === "weekly") {
    const start = new Date(d); start.setDate(d.getDate() - ((d.getDay() + 6) % 7) - 7);
    return isoWeek(start);
  }
  if (kind === "monthly") {
    const p = new Date(d.getFullYear(), d.getMonth() - 1, 1);
    return `${p.getFullYear()}-${pad(p.getMonth() + 1)}`;
  }
  const qStart = new Date(d.getFullYear(), Math.floor(d.getMonth() / 3) * 3, 1);
  const prev = new Date(qStart); prev.setDate(0);
  return `${prev.getFullYear()}-Q${Math.floor(prev.getMonth() / 3) + 1}`;
}
function dueToday(kind, now) {
  if (kind === "daily") return true;
  if (kind === "weekly") return now.getDay() === 1;
  if (kind === "monthly") return now.getDate() === 1;
  return now.getDate() === 1 && now.getMonth() % 3 === 0;
}
const arrivalOf = (kind, now) => new Date(now.getFullYear(), now.getMonth(), now.getDate(), ...TEAM[kind].time);

// 12x16. H 머리, L 긴머리, S 피부, E 눈, R 볼, M 입, G 안경, C 상의, D 상의 그림자, A 포인트, P 하의, B 신발
const BODY = {
  down: [
    "....HHHH....", "..HHHHHHHH..", ".HHHHHHHHHH.", ".HHHHHHHHHH.", ".HSSSSSSSSH.",
    "LHSESSSSESHL", "LHSRSSSSRSHL", "L..SSMMSS..L", "L.CCCAACCC.L", ".CCCCAACCCC.",
    ".SCCCCCCCCS.", ".SDCCCCCCDS.", "..PPPPPPPP..",
  ],
  up: [
    "....HHHH....", "..HHHHHHHH..", ".HHHHHHHHHH.", ".HHHHHHHHHH.", ".HHHHHHHHHH.",
    "LHHHHHHHHHHL", "LHHHHHHHHHHL", "L..SSSSSS..L", "L.CCCCCCCC.L", ".CCCCCCCCCC.",
    ".SCCCCCCCCS.", ".SDCCCCCCDS.", "..PPPPPPPP..",
  ],
  side: [
    "....HHHH....", "..HHHHHHHH..", ".HHHHHHHHHH.", ".HHHHHHHHHH.", ".HHHHSSSSSS.",
    "LHHHSSSSESS.", "LHHHSSSSRSS.", "L...SSSSSM..", "L..CCCCCC...", "...CCSCCC...",
    "...CCSCCC...", "...CDCCDC...", "...PPPPPP...",
  ],
};
const LEGS = {
  stand: ["..PPP..PPP..", "..PPP..PPP..", "..BBB..BBB.."],
  a: ["..PPP..PPP..", "..BBB..PPP..", ".......BBB.."],
  b: ["..PPP..PPP..", "..PPP..BBB..", "..BBB......."],
  sideStand: ["....PPPP....", "....PPPP....", "....BBBBB..."],
  sideA: ["...PP..PP...", "..PP....PP..", ".BBB....BBB."],
};
const BASE = { S: "#ffd9b8", E: "#2b2233", R: "#ff9fae", M: "#c4575c", B: "#2b2233", G: "#2b2233" };
const spriteCache = new Map();
function sprite(look, dir, step) {
  const key = JSON.stringify(look) + dir + step;
  if (spriteCache.has(key)) return spriteCache.get(key);
  const rows = (dir === "left" || dir === "right") ? BODY.side.slice() : BODY[dir].slice();
  if (look.glasses && dir === "down") rows[5] = "LHGEGSSGEGHL";
  if (look.glasses && (dir === "left" || dir === "right")) rows[5] = "LHHHSSSGEGS.";
  const side = dir === "left" || dir === "right";
  const legs = side ? (step === 1 ? LEGS.sideA : LEGS.sideStand) : (step === 1 ? LEGS.a : step === 2 ? LEGS.b : LEGS.stand);
  const all = rows.concat(legs);
  const pal = Object.assign({}, BASE, { H: look.hair, L: look.long ? look.hair : null, C: look.shirt, D: look.shirtDark, A: look.accent, P: look.pants });
  const c = document.createElement("canvas"); c.width = 12; c.height = 16;
  const g = c.getContext("2d");
  all.forEach((row, y) => [...row].forEach((ch, x) => {
    const col = pal[ch];
    if (ch === "." || !col) return;
    g.fillStyle = col; g.fillRect(dir === "left" ? 11 - x : x, y, 1, 1);
  }));
  spriteCache.set(key, c);
  return c;
}
function avatarURL(look, scale = 4) {
  const c = document.createElement("canvas"); c.width = 12 * scale; c.height = 16 * scale;
  const g = c.getContext("2d"); g.imageSmoothingEnabled = false;
  g.drawImage(sprite(look, "down", 0), 0, 0, c.width, c.height);
  return c.toDataURL();
}

const DESKS = { daily: { x: 32, y: 118 }, weekly: { x: 88, y: 118 }, monthly: { x: 200, y: 118 }, quarterly: { x: 256, y: 118 } };

function pathDoorToSeat(k) { const s = seatOf(k); return [{ x: DOOR.x, y: AISLE_Y }, { x: s.x, y: AISLE_Y }, s]; }
function pathSeatToDeliver(k) { const d = deliverSpot(k); return [{ x: chars[k].x, y: AISLE_Y }, { x: CENTER_X, y: AISLE_Y }, { x: CENTER_X, y: 100 }, d]; }
function pathDeliverToSeat(k) { const s = seatOf(k); return [{ x: CENTER_X, y: 100 }, { x: CENTER_X, y: AISLE_Y }, { x: s.x, y: AISLE_Y }, s]; }
function pathSeatToDoor(k) { return [{ x: chars[k].x, y: AISLE_Y }, { x: DOOR.x, y: AISLE_Y }, { x: DOOR.x, y: DOOR.y }]; }

function pathToSeat(k) { const c = chars[k], s = seatOf(k); return [{ x: c.x, y: AISLE_Y }, { x: s.x, y: AISLE_Y }, s]; }
function leave(k) { const c = chars[k]; c.mode = "leaving"; c.path = pathSeatToDoor(k); c.onArrive = () => { c.visible = false; c.mode = "away"; }; }

/* 휴게 공간 (Lv.9): 자리에서 일하는 팀원이 가끔 커피를 타서 휴게 공간에서 쉬다 돌아온다 */
const COFFEE_SPOT = { x: 282, y: 154 };
const LOUNGE_SEATS = [{ x: 204, y: 190 }, { x: 230, y: 190 }, { x: 284, y: 190 }];
const ON_BREAK = ["toCoffee", "coffee", "toLounge", "resting", "backFromBreak"];
const COFFEE_LINES = ["☕ 커피 한 잔!", "☕ 오늘은 라떼로", "☕ 샷 추가해야지"];
const REST_LINES = ["😌 잠깐 쉬어요", "🍪 당 충전 중", "📱 요즘 뜨는 밈 구경 중"];
const rnd = (a, b) => a + Math.random() * (b - a);
const pick = a => a[Math.floor(Math.random() * a.length)];
// 이동하는 사이에 보고·작성·퇴근할 일이 생겼으면 쉬는 걸 멈추고 그쪽으로 간다
function breakOver(k) {
  const c = chars[k], w = targetMode(k, NOW());
  if (w === "working") return false;
  if (w === "away") leave(k); else setMode(k, w);
  return true;
}
function updateBreaks(t) {
  const busy = KINDS.filter(o => ON_BREAK.includes(chars[o].mode));
  for (const k of KINDS) {
    const c = chars[k];
    if (!c.visible || c.path.length) continue;
    if (c.mode === "working") {
      if (!c.nextBreak) c.nextBreak = t + rnd(8000, 40000);
      if (t < c.nextBreak) continue;
      const seat = LOUNGE_SEATS.findIndex((_, i) => !busy.some(o => chars[o].loungeSeat === i));
      if (busy.length >= 2 || seat < 0) { c.nextBreak = t + rnd(5000, 15000); continue; }
      busy.push(k);
      c.loungeSeat = seat; c.mode = "toCoffee";
      c.path = [{ x: c.x, y: AISLE_Y }, { x: COFFEE_SPOT.x, y: AISLE_Y }, COFFEE_SPOT];
      c.onArrive = () => {
        if (breakOver(k)) return;
        c.mode = "coffee"; c.dir = "right"; c.breakUntil = performance.now() + 4000;
        say(k, pick(COFFEE_LINES), 3500); renderRoster();
      };
      renderRoster();
    } else if (c.mode === "coffee" && t >= c.breakUntil) {
      const s = LOUNGE_SEATS[c.loungeSeat];
      c.mode = "toLounge";
      c.path = [{ x: c.x, y: AISLE_Y }, { x: s.x, y: AISLE_Y }, s];
      c.onArrive = () => {
        if (breakOver(k)) return;
        c.mode = "resting"; c.dir = "down"; c.breakUntil = performance.now() + rnd(15000, 25000);
        say(k, pick(REST_LINES), 3500); renderRoster();
      };
    } else if (c.mode === "resting" && t >= c.breakUntil) {
      c.mode = "backFromBreak";
      c.path = pathToSeat(k);
      c.onArrive = () => {
        c.mode = "working"; c.dir = "up"; c.nextBreak = performance.now() + rnd(45000, 90000);
        setMode(k, targetMode(k, NOW()));
      };
      renderRoster();
    }
  }
}

function say(k, text, ms = 4000) { chars[k].bubble = text; chars[k].bubbleUntil = performance.now() + ms; }

/* ───────────────────────── 상태 결정 ───────────────────────── */
// 상태: away(출근 전/퇴근) · writing(작성 중) · delivering(보고 대기) · working(자리에서 일하는 중)
function targetMode(k, now) {
  if (isWeekend(now) && !dueToday(k, now)) return "away";  // 주말엔 담당 리포트가 있는 날만 출근
  const latest = latestOf(k);
  const unread = latest && !isRead(k, latest.id);
  const arrived = now >= arrivalOf(k, now);
  if (!arrived) return "away";
  if (dueToday(k, now) && !findReport(k, expectedId(k, now))) return "writing";
  if (unread) return "delivering";
  if (now.getHours() >= OFF_HOUR) return "away";
  return "working";
}

function refreshStates(firstLoad) {
  const now = NOW();
  let arrivals = 0;
  const today = ymd(now);
  save.arrived[today] = save.arrived[today] || {};
  for (const k of KINDS) {
    const c = chars[k];
    const want = targetMode(k, now);
    if (want === c.mode && c.visible) continue;
    if (want === "away") {
      if (c.visible && !firstLoad) leave(k);
      else { c.visible = false; c.mode = "away"; }
      continue;
    }
    const seen = save.arrived[today][k];
    if (!c.visible) {
      if (!seen) {
        // 문으로 걸어 들어오는 출근 연출
        if (!SIM) { save.arrived[today][k] = true; persist(); }  // 미리보기는 기록하지 않음
        Object.assign(c, { visible: true, x: DOOR.x, y: DOOR.y, dir: "up", path: pathDoorToSeat(k), delay: arrivals++ * 1.8 });
        c.mode = "arriving";
        c.onArrive = () => { c.dir = "up"; setMode(k, targetMode(k, NOW())); };
        setTimeout(() => say(k, "출근했습니다!", 2500), (arrivals - 1) * 1800);
        addLog(hm(arrivalOf(k, now)), `${TEAM[k].name} ${TEAM[k].title} 출근`);
      } else {
        const s = want === "delivering" ? deliverSpot(k) : seatOf(k);
        Object.assign(c, { visible: true, x: s.x, y: s.y, dir: "up", path: [] });
        c.mode = want;
      }
      continue;
    }
    if (["arriving", "leaving", "returning", "toDeliver", "toCoffee", "toLounge", "backFromBreak"].includes(c.mode)) continue;
    if (ON_BREAK.includes(c.mode) && want === "working") continue;
    setMode(k, want);
  }
  persist();
  renderRoster(); renderLog(); renderHud();
}

function setMode(k, want) {
  const c = chars[k];
  if (want === "delivering" && c.mode !== "delivering") {
    c.mode = "toDeliver";
    c.path = pathSeatToDeliver(k);
    c.onArrive = () => {
      c.mode = "delivering"; c.dir = "up";
      const w = targetMode(k, NOW());
      if (w !== "delivering") return setMode(k, w);
      say(k, "보고드릴게 있어요!", 3000); renderRoster();
    };
  } else if (want === "working" && c.mode === "delivering") {
    c.mode = "returning";
    c.path = pathDeliverToSeat(k);
    c.onArrive = () => { c.mode = "working"; c.dir = "up"; renderRoster(); };
  } else if (ON_BREAK.includes(c.mode)) {
    // 휴게 공간에 있다가 작성할 일이 생기면 자리로 돌아간다
    c.mode = "backFromBreak";
    c.path = pathToSeat(k);
    c.onArrive = () => { c.mode = "working"; c.dir = "up"; setMode(k, targetMode(k, NOW())); };
  } else if (want !== "delivering") {
    c.mode = want;
  }
  renderRoster();
}

const bubbleEls = {};
function placeBubble(k, x, y, text, alert) {
  let el = bubbleEls[k];
  if (!el) { el = bubbleEls[k] = document.createElement("div"); el.className = "bubble"; document.getElementById("bubbles").appendChild(el); }
  if (!text) { el.style.display = "none"; return; }
  el.style.display = "block";
  el.classList.toggle("alert", !!alert);
  if (el.textContent !== text) el.textContent = text;
  // 무대 밖으로 나가지 않게 px로 계산하고, 꼬리는 캐릭터 머리 위를 가리킨다
  const sw = cvs.clientWidth, sh = cvs.clientHeight, bw = el.offsetWidth;
  const cx = (x + 6) / W * sw;
  const left = Math.max(4, Math.min(sw - bw - 4, cx - bw / 2));

  el.style.top = ((y - 2) / H * sh) + "px";

let last = performance.now();
function frame(t) {
  const dt = Math.max(0, Math.min(0.25, (t - last) / 1000)); last = t;
  const now = NOW();
  const lv = level();
  ctx.clearRect(0, 0, W, H);
  const night = drawRoom(now, lv);

  // 이동
  for (const k of KINDS) {
    const c = chars[k];
    if (!c.visible || !c.path.length) continue;
    if (c.delay > 0) { c.delay -= dt; continue; }
    const tgt = c.path[0];
    const dx = tgt.x - c.x, dy = tgt.y - c.y, dist = Math.hypot(dx, dy), step = c.speed * dt;
    if (Math.abs(dx) > Math.abs(dy)) c.dir = dx > 0 ? "right" : "left"; else c.dir = dy > 0 ? "down" : "up";
    if (dist <= step) { c.x = tgt.x; c.y = tgt.y; c.path.shift(); if (!c.path.length && c.onArrive) { const f = c.onArrive; c.onArrive = null; f(); } }
    else { c.x += dx / dist * step; c.y += dy / dist * step; }
  }
  if (lv >= 9) updateBreaks(t);
  // y 순서대로 그리기
  const order = KINDS.filter(k => chars[k].visible).sort((a, b) => chars[a].y - chars[b].y);
  for (const k of order) {
    const c = chars[k];
    const walking = c.path.length > 0 && !(c.delay > 0);
    const step = walking ? 1 + Math.floor(t / 160) % 2 : 0;
    const sitting = !walking && (c.mode === "working" || c.mode === "writing");
    const bob = sitting && c.mode === "writing" && Math.floor(t / 250) % 2 ? 1 : 0;
    ctx.drawImage(sprite(lookOf(k), c.dir, step), Math.round(c.x), Math.round(c.y) + bob);
    if (sitting) rect(DESKS[k].x + 8, 144, 16, 2, "#4b4370"); // 의자 등받이
  }
  // 말풍선
  for (const k of KINDS) {
    const c = chars[k];
    let text = null, alert = false;
    if (c.visible && c.y < H) {
      if (c.bubble && t < c.bubbleUntil) text = c.bubble;
      else if (c.mode === "delivering") { text = "📄 보고드릴게 있어요!"; alert = true; }
      else if (c.mode === "writing") text = "✍️ 작성 중" + ".".repeat(1 + Math.floor(t / 400) % 3);
      else if (c.mode === "working") text = nudgeText(k);
      else if (c.mode === "resting") text = "☕ 휴식 중";
    }
    placeBubble(k, c.x, c.y, text, alert);
  }
  if (night) { ctx.fillStyle = "rgba(20, 16, 60, .28)"; ctx.fillRect(0, 0, W, H); }
}
function loop(t) { frame(t); requestAnimationFrame(loop); }
// requestAnimationFrame이 멈추는 환경(숨겨진 탭 등)에서도 걸음이 이어지도록
setInterval(() => { const t = performance.now(); if (t - last > 300) frame(t); }, 200);

function canvasPoint(ev) {
  const r = cvs.getBoundingClientRect();
  return { x: (ev.clientX - r.left) / r.width * W, y: (ev.clientY - r.top) / r.height * H };
}
function hitTest(p) {
  for (const k of KINDS) {
    const c = chars[k];
    if (c.visible && p.x >= c.x - 2 && p.x <= c.x + 14 && p.y >= c.y - 14 && p.y <= c.y + 16) return { type: "char", k };
  }
  if (p.x >= PLAYER_DESK.x && p.x <= PLAYER_DESK.x + PLAYER_DESK.w && p.y >= 44 && p.y <= PLAYER_DESK.y + PLAYER_DESK.h) return { type: "desk" };
  if (p.x >= 233 && p.x <= 255 && p.y >= 5 && p.y <= 38) return { type: "badges" };
  if (level() >= 4 && p.x >= 80 && p.x <= 136 && p.y >= 8 && p.y <= 38) return { type: "board" };
  if (level() >= 5 && p.x <= 16 && p.y >= 56 && p.y <= 104) return { type: "shelf" };
  for (const k of KINDS) { const d = DESKS[k]; if (p.x >= d.x && p.x <= d.x + 32 && p.y >= d.y && p.y <= d.y + 20) return { type: "char", k }; }
  return null;
}
cvs.addEventListener("mousemove", ev => { cvs.style.cursor = hitTest(canvasPoint(ev)) ? "pointer" : "default"; });
cvs.addEventListener("click", ev => {
  const hit = hitTest(canvasPoint(ev));
  if (!hit) return;
  if (hit.type === "char") talkTo(hit.k);
  if (hit.type === "desk") openArchive();
  if (hit.type === "board") openKeywords();
  if (hit.type === "shelf") openScrapbook();
  if (hit.type === "badges") openBadges();
});

function talkTo(k) {
  const c = chars[k], m = TEAM[k];
  const latest = latestOf(k);
  if (latest && !isRead(k, latest.id)) return openReport(k, latest.id);
  if (!c.visible) {
    if (latest) return openReport(k, latest.id);
    return toast(`${m.name} ${m.title}은(는) ${m.when}에 출근해요.`);
  }
  if (c.mode === "writing") return say(k, m.writing);
  if (k === "daily" && NUDGE.daily) return openReview();
  if (k === "daily" && NUDGE.idea) return openIdeaRevisit(dueIdeas()[0][0]);
  if (k === "weekly" && NUDGE.weekly) return openWeeklyQuiz(isoWeek(NOW()));
  const line = m.idle[Math.floor(Math.random() * m.idle.length)];
  say(k, line, 4500);
  if (latest) toast(`${m.name}: "${line}" — 지난 리포트는 📥 받은 리포트에서 볼 수 있어요.`);
}

          <button class="scrap">${sc ? "★ 스크랩됨" : "☆ 스크랩"}</button></div>

        ${it.why ? `<div class="note why"><b>왜 주목할까</b>${esc(it.why)}</div>` : ""}

        ${memoFields(sc)}

  openModal(`

      <div class="say"><div class="from">${m.name} ${m.title} · ${KIND_NAME[k]} 보고</div><div class="line">${line}</div></div>
      <button class="x" data-close aria-label="닫기">×</button></div>
    <div class="modal-body">
      <span class="badge" style="background:${KIND_COLOR[k]}">${KIND_NAME[k]}${weekend ? " · 주말판" : ""}</span>
      <p class="r-period">${esc(doc.period_label || id)}</p>
      <h2 class="r-headline">${esc(doc.headline)}</h2>
      ${doc.summary && doc.summary.length ? `<ol class="r-summary">${doc.summary.map(s => `<li>${esc(s)}</li>`).join("")}</ol>` : ""}
      ${doc.keywords && doc.keywords.length ? `<div class="chips">${doc.keywords.map(x => `<span>#${esc(x)}</span>`).join("")}</div>` : ""}
      ${secs}
      ${doc.follow_up && doc.follow_up.length ? `<section class="r-sec"><h3>다음에 지켜볼 것</h3><ul>${doc.follow_up.map(f => `<li>${esc(f)}</li>`).join("")}</ul></section>` : ""}
      <div class="r-foot">
        <button class="btn" id="mark-read" ${read ? "disabled" : ""}>${read ? "✓ 읽음 완료" : `✅ 다 읽었어요 (+${XP_READ[k]} XP)`}</button>
        ${read ? `<button class="btn ghost" id="take-quiz">${qz ? `🧠 퀴즈 ${qz.score}/${qz.total} · 다시 풀기` : "🧠 퀴즈 풀기"}</button>` : ""}
        <a class="link" href="${esc(r.html)}" target="_blank">원본 리포트 페이지로 보기 ↗</a>
      </div>
    </div>`);

  modal.querySelectorAll(".r-card").forEach(card => {
    const key = card.dataset.key;
    const item = doc.sections[+card.dataset.si].items[+card.dataset.ii];
    card.querySelector(".scrap").onclick = () => toggleScrap(card, key, k, r, item);

/* 스크랩 메모는 '아이디어' 한 칸. 예전 기록의 memo는 아이디어로 본다 */
const ideaOf = sc => sc.idea ?? sc.memo ?? "";
const hasMemo = sc => !!(ideaOf(sc).trim() || (sc.notes || []).length);
const notesHtml = sc => sc && sc.notes && sc.notes.length
  ? `<ol class="inotes">${sc.notes.map(n => `<li><time>🌱 ${esc(n.at)}</time>${esc(n.text)}</li>`).join("")}</ol>` : "";
function memoFields(sc) {

    <label>💡 내 아이디어<textarea data-memo="idea" placeholder="써먹을 아이디어, 우리 브랜드라면 어떻게 할지…">${esc(sc ? ideaOf(sc) : "")}</textarea></label>
    ${notesHtml(sc)}

}
function bindMemo(card, key, back) {
  const g = card.querySelector("[data-grow]");
  if (g) g.onclick = () => openIdeaRevisit(key, back);
  card.querySelectorAll("[data-memo]").forEach(ta => ta.onchange = () => {

function toggleScrap(card, key, k, r, item) {
  const btn = card.querySelector(".scrap");
  if (save.scraps[key]) {
    if (hasMemo(save.scraps[key]) && !confirm("메모도 함께 지워져요. 스크랩을 취소할까요?")) return;
    delete save.scraps[key]; card.classList.remove("scrapped"); btn.textContent = "☆ 스크랩";

    kind: k, reportId: r.id, reportLabel: r.doc.period_label || r.id, savedAt: NOW().toISOString(), idea: "",
    item: { title: item.title, tag: item.tag, brand: item.brand, body: item.body, why: item.why, action: item.action, sources: item.sources || [] },
  };

function markRead(k, id, btn) {
  const now = NOW();
  save.read[readKey(k, id)] = `${ymd(now)}T${hm(now)}`;
  if (k === "daily" && !save.readDays.includes(ymd(now))) save.readDays.push(ymd(now));
  persist();

  let xp = XP_READ[k];
  const s = streakDays();
  if (k === "daily" && s >= 3) xp += 5;
  gainXp(xp, k === "daily" && s >= 3 ? `읽음 완료 + 🔥${s}일 연속 보너스` : "읽음 완료");
  say(k, TEAM[k].thanks, 4000);
  setTimeout(() => openQuiz(k, id), 700);
  const latest = latestOf(k);
  if (latest && latest.id === id && chars[k].mode === "delivering") setMode(k, targetMode(k, NOW()));

}

/* ───────────────────────── 퀴즈 ───────────────────────── */
function seeded(str) {
  let h = 1779033703 ^ str.length;
  for (let i = 0; i < str.length; i++) { h = Math.imul(h ^ str.charCodeAt(i), 3432918353); h = h << 13 | h >>> 19; }
  return () => { h = Math.imul(h ^ h >>> 16, 2246822507); h = Math.imul(h ^ h >>> 13, 3266489909); return ((h ^= h >>> 16) >>> 0) / 4294967296; };
}
function shuffle(arr, rnd) { const a = arr.slice(); for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(rnd() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; }

/** 리포트에 퀴즈가 없으면(초기 리포트) '왜 주목할까' 설명으로 항목을 맞히는 문제를 만든다 */
function quizOf(k, r) {
  const qs = (r.doc.quiz || []).filter(q => q.q && Array.isArray(q.options) && q.options.length >= 2 && Number.isInteger(q.answer));
  if (qs.length) return qs;
  const rnd = seeded(k + r.id);
  const items = (r.doc.sections || []).flatMap(s => s.items || []).filter(it => it.title && it.why);
  if (items.length < 4) return [];
  return shuffle(items, rnd).slice(0, 3).map(it => {
    const options = shuffle([it.title, ...shuffle(items.filter(x => x !== it), rnd).slice(0, 3).map(x => x.title)], rnd);
    return { q: `다음 설명은 어떤 항목에 대한 이야기일까요?\n“${it.why}”`, options, answer: options.indexOf(it.title), explain: `'${it.title}' 항목의 '왜 주목할까' 내용이에요.` };
  });
}

/** 문제마다 출처(어느 리포트의 몇 번째 문제인지)를 붙인다 — 오답노트에 쓴다 */
function quizWithSrc(k, r) {
  return quizOf(k, r).map((q, qi) => ({ ...q, src: { k, id: r.id, qi, label: `${KIND_NAME[k]} · ${r.doc.period_label || r.id}` } }));
}

/** 퀴즈 진행 화면. onFinish는 { line, sub, back, xp, why }를 돌려준다 */
function runQuiz({ k, label, intro, note, showSrc, qs, onAnswer, onFinish }) {
  const m = TEAM[k];
  let i = 0, score = 0;
  const head = line => `<div class="modal-head"><img src="${AVATAR[k]}" alt=""><div class="say"><div class="from">${m.name} ${m.title} · ${label}</div><div class="line">${line}</div></div><button class="x" data-close aria-label="닫기">×</button></div>`;
  const show = () => {
    const q = qs[i];
    openModal(`${head(i === 0 ? intro : "다음 문제예요!")}
      <div class="modal-body"><div class="qprog">${i + 1} / ${qs.length}${note ? ` · ${note}` : ""}</div>
      ${showSrc && q.src ? `<p class="r-period" style="margin:2px 0 0">${esc(q.src.label)}</p>` : ""}
      <div class="qtext">${esc(q.q)}</div>
      ${q.options.map((o, oi) => `<button class="qopt" data-oi="${oi}">${"①②③④⑤"[oi] || oi + 1} ${esc(o)}</button>`).join("")}
      <div id="qafter"></div></div>`, true);
    modal.querySelectorAll(".qopt").forEach(b => b.onclick = () => {
      const pick = +b.dataset.oi, ok = pick === q.answer;
      if (ok) score++;
      if (onAnswer) onAnswer(q, ok);
      modal.querySelectorAll(".qopt").forEach(x => { x.disabled = true; if (+x.dataset.oi === q.answer) x.classList.add("right"); });
      if (!ok) b.classList.add("wrong");
      const last = i === qs.length - 1;
      document.getElementById("qafter").innerHTML = `<div class="qexp"><b>${ok ? "⭕ 정답!" : "❌ 아쉬워요"}</b> ${esc(q.explain || "")}${ok ? "" : `<br><span class="link">📝 오답노트에 담아둘게요.</span>`}</div>
        <button class="btn" id="qnext">${last ? "결과 보기" : "다음 문제 →"}</button>`;
      document.getElementById("qnext").onclick = () => { if (last) finish(); else { i++; show(); } };
    });
  };
  const finish = () => {
    const res = onFinish(score, qs.length);
    persist();
    openModal(`${head(res.line)}<div class="modal-body center">
      <div class="qscore">${score} / ${qs.length}</div>
      <p>${res.sub}</p>
      <div class="toolbar" style="justify-content:center">${res.back ? `<button class="btn ghost" id="q-back">${res.back.label}</button>` : ""}<button class="btn" data-close>닫기</button></div></div>`, true);
    if (res.back) document.getElementById("q-back").onclick = res.back.fn;
    if (res.xp) gainXp(res.xp, res.why);
    checkBadges(); renderHud(); renderRoster(); renderLog();
  };
  show();
}
const nowStamp = () => `${ymd(NOW())}T${hm(NOW())}`;

function openQuiz(k, id) {
  const r = findReport(k, id); if (!r) return;
  const qs = quizWithSrc(k, r); if (!qs.length) return;
  const key = readKey(k, id), first = !save.quiz[key];
  runQuiz({
    k, label: "확인 퀴즈", intro: `잠깐! 방금 읽은 내용으로 ${qs.length}문제만 낼게요 🧠`,
    note: first ? "정답마다 +5 XP" : "다시 풀기 (경험치 없음)", qs, onAnswer: noteAnswer,
    onFinish(score, total) {
      const perfect = score === total;
      let xp = 0;
      if (first) { xp = score * 5 + (perfect ? 5 : 0); save.quiz[key] = { score, total, at: nowStamp() }; }
      else if (score > save.quiz[key].score) save.quiz[key] = { score, total, at: nowStamp() };
      return {
        line: perfect ? "완벽해요! 오늘 트렌드는 확실히 챙기셨네요 👏" : score ? "좋아요! 틀린 문제는 📝 오답노트에 모아뒀어요." : "괜찮아요, 틀린 문제는 📝 오답노트에서 다시 풀 수 있어요!",
        sub: first ? (xp ? `<b>+${xp} XP</b>${perfect ? " (만점 보너스 포함)" : ""}` : "이번엔 경험치가 없어요") : "다시 풀기는 경험치가 없어요",
        back: { label: "보고서 다시 보기", fn: () => openReport(k, id) }, xp, why: `퀴즈 ${score}/${total}`,
      };
    },
  });
}

/* ───────────────────────── 오답노트 ───────────────────────── */
// 틀린 문제는 save.wrong에 모이고, 다시 맞히면 빠진다. 하루가 지나면 하루 사원이 복습하자고 한다.
const wrongKey = src => `${src.k}/${src.id}#${src.qi}`;
const wrongList = () => Object.entries(save.wrong).sort((a, b) => a[1].at.localeCompare(b[1].at));
const dueWrong = () => wrongList().filter(([, w]) => w.at < ymd(NOW()));
/** 답을 기록한다. 오답노트에 있던 문제를 맞혔으면 true */
function noteAnswer(q, ok) {
  if (!q.src) return false;
  const key = wrongKey(q.src);
  if (ok) {
    if (!save.wrong[key]) return false;
    delete save.wrong[key]; save.wrongCleared++;
    return true;
  }
  save.wrong[key] = { q: { q: q.q, options: q.options, answer: q.answer, explain: q.explain || "", src: q.src }, at: ymd(NOW()), misses: (save.wrong[key]?.misses || 0) + 1 };
  return false;
}
function openWrongNote() {
  const list = wrongList(), n = Math.min(5, list.length);
  openModal(`<div class="modal-head"><img src="${AVATAR.daily}" alt=""><div class="say"><div class="from">${esc(who("daily"))} · 📝 오답노트</div>
    <div class="line">${list.length ? `틀린 문제 ${list.length}개를 모아뒀어요. 맞히면 노트에서 빠지고 +3 XP예요!` : "오답노트가 비어 있어요. 깔끔해요! ✨"}</div></div>
    <button class="x" data-close aria-label="닫기">×</button></div>
    <div class="modal-body">
      ${list.length ? `<div class="toolbar"><button class="btn" id="review-go">📝 복습 퀴즈 풀기 (${n}문제)</button></div>` : ""}
      <p class="r-period">지금까지 다시 맞혀서 해결한 문제: ${save.wrongCleared}개</p>
      <ul class="wlist">${list.map(([, w]) => `<li><div class="src">${esc(w.q.src.label)} · ${esc(w.at)}${w.misses > 1 ? ` · ${w.misses}번 틀림` : ""}</div>
        <div class="q">${esc(w.q.q)}</div>
        <details><summary>정답 보기</summary><b>${esc(w.q.options[w.q.answer])}</b> — ${esc(w.q.explain)}</details></li>`).join("")}</ul>
    </div>`);
  const go = document.getElementById("review-go");
  if (go) go.onclick = openReview;
}
function openReview() {
  const qs = wrongList().slice(0, 5).map(([, w]) => w.q);
  if (!qs.length) return toast("복습할 문제가 없어요");
  let cleared = 0;
  runQuiz({
    k: "daily", label: "오답 복습", intro: `지난번에 틀린 문제 ${qs.length}개, 다시 풀어볼까요? 📝`,
    note: "맞히면 +3 XP", showSrc: true, qs,
    onAnswer(q, ok) { if (noteAnswer(q, ok)) cleared++; },
    onFinish(score, total) {
      const left = Object.keys(save.wrong).length;
      return {
        line: score === total ? "전부 맞혔어요! 이제 확실히 기억하시겠죠? 💪" : "틀린 문제는 노트에 남겨둘게요. 내일 또 풀어봐요!",
        sub: `${cleared ? `<b>+${cleared * 3} XP</b> · ` : ""}오답노트에 남은 문제 ${left}개`,
        back: left ? { label: "오답노트 보기", fn: openWrongNote } : null, xp: cleared * 3, why: `오답 ${cleared}문제 해결`,
      };
    },
  });
}

/* ───────────────────────── 주간 복습 ───────────────────────── */
// 한 주의 데일리 퀴즈에서 최대 10문제. 처음 풀 때만 정답마다 +3 XP, 만점이면 +10.
function dailyWeeks() {
  const map = new Map();
  for (const r of reportsOf("daily")) {
    const [y, mo, d] = r.id.split("-").map(Number);
    const w = isoWeek(new Date(y, mo - 1, d));
    if (!map.has(w)) map.set(w, []);
    map.get(w).push(r);
  }
  return [...map.entries()].sort((a, b) => b[0].localeCompare(a[0]));
}
function weekTitle(w) {
  const [y, n] = w.split("-W").map(Number);
  const jan4 = new Date(y, 0, 4), mon = new Date(jan4);
  mon.setDate(jan4.getDate() - ((jan4.getDay() + 6) % 7) + (n - 1) * 7);
  const sun = new Date(mon); sun.setDate(mon.getDate() + 6);
  return `${y}년 ${n}주차 (${mon.getMonth() + 1}/${mon.getDate()} ~ ${sun.getMonth() + 1}/${sun.getDate()})`;
}
const weekPool = rs => rs.flatMap(r => quizWithSrc("daily", r));
function openWeeklyQuiz(w) {
  const rs = (dailyWeeks().find(x => x[0] === w) || [])[1] || [];
  const pool = weekPool(rs);
  if (pool.length < 3) return toast("이 주는 문제가 부족해요");
  const qs = shuffle(pool, Math.random).slice(0, 10);
  const first = !save.weekly[w];
  runQuiz({
    k: "weekly", label: "주간 복습", intro: `${weekTitle(w)} 데일리에서 ${qs.length}문제 골라왔어요. 한 주 복습해볼까요? 🗓`,
    note: first ? "정답마다 +3 XP" : "다시 풀기 (경험치 없음)", showSrc: true, qs, onAnswer: noteAnswer,
    onFinish(score, total) {
      const perfect = score === total;
      let xp = 0;
      if (first) { xp = score * 3 + (perfect ? 10 : 0); save.weekly[w] = { score, total, at: nowStamp() }; }
      else if (score > save.weekly[w].score) save.weekly[w] = { score, total, at: nowStamp() };
      return {
        line: perfect ? "한 주를 완벽하게 정리하셨네요! 👏" : "좋아요! 틀린 문제는 📝 오답노트에 모아뒀어요.",
        sub: first ? (xp ? `<b>+${xp} XP</b>${perfect ? " (만점 보너스 포함)" : ""}` : "이번엔 경험치가 없어요") : "다시 풀기는 경험치가 없어요",
        back: { label: "주간 복습 목록", fn: () => { archTab = "review"; openArchive(); } }, xp, why: `주간 복습 ${score}/${total}`,
      };
    },
  });
}

/* ───────────────────────── 아이디어 다시 보기 ───────────────────────── */
// 아이디어를 쓰거나 마지막으로 다시 본 지 일주일이 지나면 하루 사원이 다시 가져온다.
const REVISIT_DAYS = 7;
const GROW_PROMPTS = [

      <div class="toolbar">
        <button class="btn" id="grow-save">덧붙이기${save.memoXp[xpKey] ? "" : " (+3 XP)"}</button>
        <button class="btn ghost" id="grow-skip">지금은 그대로 둘게요</button>
        ${back ? `<button class="btn ghost" id="grow-back">${esc(back.label)}</button>` : ""}
      </div>
      <ul class="srcs">${(sc.item.sources || []).filter(x => /^https?:/.test(x.url || "")).map(x => `<li><a href="${esc(x.url)}" target="_blank" rel="noopener">${esc(x.name || x.url)}</a>${x.date ? ` · ${esc(x.date)}` : ""}</li>`).join("")}</ul>
    </div>`);
  const done = msg => {
    sc.revisitedAt = today; persist();
    renderRoster(); checkBadges();
    if (msg) toast(msg);
    if (back) return back.fn();
    const next = dueIdeas()[0];
    if (next) setTimeout(() => openIdeaRevisit(next[0]), 300); else closeModal();
  };
  document.getElementById("grow-save").onclick = () => {
    const text = document.getElementById("grow-text").value.trim();
    if (!text) return toast("덧붙일 생각을 적어주세요");
    (sc.notes = sc.notes || []).push({ at: today, text });
    const firstXp = !save.memoXp[xpKey];
    if (firstXp) { save.memoXp[xpKey] = true; gainXp(3, "아이디어 발전 🌱"); }
    done(firstXp ? null : "생각을 덧붙였어요 🌱");
  };
  document.getElementById("grow-skip").onclick = () => done("일주일 뒤에 다시 가져올게요");

function longestStreak() {
  const days = [...new Set(save.readDays)].sort();
  let best = 0, run = 0, prev = null;
  for (const d of days) {
    const t = new Date(d + "T00:00");
    run = prev && Math.round((t - prev) / 864e5) === 1 ? run + 1 : 1;
    best = Math.max(best, run); prev = t;
  }
  return best;
}

        <input data-tname="${k}" maxlength="8" value="${esc((save.teamNames || {})[k] || "")}" placeholder="${esc(DEFAULT_NAME[k])}"></label>`).join("")}</div>
      <div class="toolbar"><button class="btn" id="save-name">저장</button></div>
      <p class="link">기록(읽음, 경험치, 스크랩, 메모)은 이 브라우저에만 저장돼요. 브라우저를 바꾸거나 데이터를 지우기 전에 백업해두세요.</p>
      <div class="toolbar">
        <button class="btn ghost" id="export">기록 백업 받기</button>
        <label class="btn ghost">기록 불러오기<input type="file" id="import" accept="application/json" hidden></label>
        <button class="btn ghost" id="replay">출근 장면 다시 보기</button>
      </div>
    </div>`, true);
  document.getElementById("save-name").onclick = () => {
    save.me = document.getElementById("me-name").value.trim();
    save.teamNames = {};
    modal.querySelectorAll("[data-tname]").forEach(i => { const v = i.value.trim(); if (v) save.teamNames[i.dataset.tname] = v; });
    persist(); applyTeamNames();
    extraLog = [];  // 예전 이름으로 남은 출근 기록은 renderLog가 새 이름으로 다시 만든다
    renderHud(); renderRoster(); renderLog(); closeModal(); toast("저장했어요");
  };
  document.getElementById("export").onclick = () => {
    const a = document.createElement("a");
    a.href = URL.createObjectURL(new Blob([JSON.stringify(save, null, 2)], { type: "application/json" }));
    a.download = `marketing-office-backup-${ymd(NOW())}.json`; a.click();
  };
  document.getElementById("import").onchange = ev => {
    const f = ev.target.files[0]; if (!f) return;
    f.text().then(t => { save = Object.assign(defaultSave(), JSON.parse(t)); persist(); applyTeamNames(); closeModal(); refreshStates(true); toast("기록을 불러왔어요"); })
      .catch(() => toast("파일을 읽지 못했어요"));
  };
  document.getElementById("replay").onclick = () => {
    delete save.arrived[ymd(NOW())]; persist();
    KINDS.forEach(k => Object.assign(chars[k], { visible: false, mode: "away", path: [], onArrive: null }));
    closeModal(); refreshStates(false);
  };
}

document.getElementById("btn-archive").onclick = openArchive;
document.getElementById("btn-scrap").onclick = openScrapbook;
document.getElementById("btn-settings").onclick = openSettings;
document.getElementById("btn-level").onclick = openLevels;
document.getElementById("btn-wrong").onclick = openWrongNote;
document.getElementById("btn-badges").onclick = openBadges;

/* ───────────────────────── 시작 ───────────────────────── */
refreshStates(false);
checkBadges();
requestAnimationFrame(loop);
setInterval(() => refreshStates(false), 15000);   // 출근·퇴근 시각 확인
setInterval(reloadData, 120000);                  // 새 리포트 확인
if (!save.me && !SIM) setTimeout(() => {
  openModal(`<div class="modal-body center levelup"><img src="${ME_AVATAR}" alt="">
    <h3>마케팅팀에 오신 걸 환영해요!</h3>
    <p>매일 아침 팀원들이 출근해서 트렌드 리포트를 들고 와요.<br>읽을수록 승진하고, 사무실이 꾸며져요.</p>
    <label class="field" style="text-align:left">팀원들이 부를 이름<input id="first-name" placeholder="닉네임"></label>
    <button class="btn" id="first-go">출근하기</button></div>`, true);
  document.getElementById("first-go").onclick = () => { save.me = document.getElementById("first-name").value.trim() || "팀장"; persist(); renderHud(); closeModal(); };
}, 400);
</script>
</body>
